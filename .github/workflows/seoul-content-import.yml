name: Seoul content import

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seoul-content-import-dry-run
  cancel-in-progress: false

jobs:
  import:
    name: Validate reviewed Seoul content (no production write)
    runs-on: ubuntu-latest
    env:
      SEOUL_DATASET_PATH: data/imports/seoul_canonical_places_optimized_v5.json
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Fail closed unless the reviewed dataset is present
        shell: bash
        run: |
          set -euo pipefail
          test -f "${SEOUL_DATASET_PATH}"

      - name: Validate adapter and safety contracts
        run: pnpm test:data

      - name: Produce sanitized dry-run summary
        shell: bash
        run: |
          set -euo pipefail
          summary="${RUNNER_TEMP}/seoul-dry-run-summary.json"
          pnpm data:seoul:dry-run -- "${SEOUL_DATASET_PATH}" > "${summary}"
          SEOUL_DRY_RUN_SUMMARY="${summary}" node -e "const fs=require('fs');const p=process.env.SEOUL_DRY_RUN_SUMMARY;const x=JSON.parse(fs.readFileSync(p));if(x.mode!=='dry-run'||x.counts.accepted!==45||x.counts.quarantined!==75||!x.invariants.allDraft||!x.invariants.noImages||!x.invariants.allQueued)process.exit(1);"

      - name: Publish dry-run job summary
        shell: bash
        run: |
          set -euo pipefail
          summary="${RUNNER_TEMP}/seoul-dry-run-summary.json"
          SEOUL_DRY_RUN_SUMMARY="${summary}" node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync(process.env.SEOUL_DRY_RUN_SUMMARY));const c=x.counts;fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,['## Seoul content import dry-run','', '- Mode: validation only; no production credentials or write path', '- Accepted: '+c.accepted, '- Quarantined: '+c.quarantined, '- Accepted official: '+c.acceptedOfficial, '- Accepted verified: '+c.acceptedVerified, '- Accepted unverified: '+c.acceptedUnverified, '- Publication: draft only', '- Images: excluded', '- Review queue: required',''].join('\n'));"

      - name: Upload sanitized dry-run evidence
        uses: actions/upload-artifact@v4
        with:
          name: seoul-content-dry-run-${{ github.run_id }}
          path: ${{ runner.temp }}/seoul-dry-run-summary.json
          if-no-files-found: error
          retention-days: 14
