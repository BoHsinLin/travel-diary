name: Supabase migration readiness

on:
  workflow_dispatch:
    inputs:
      deploy_m2:
        description: Apply the reconciled pending migrations to production
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: supabase-production-migration-readiness
  cancel-in-progress: false

jobs:
  remote-history:
    name: Read-only production migration history
    runs-on: ubuntu-latest
    environment: production-migrations
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: mgxsjobicqyddoaejqvf
    steps:
      - uses: actions/checkout@v5

      - name: Fail closed when migration authority is unavailable
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}"
          test -n "${SUPABASE_DB_PASSWORD:-}"
          test "${SUPABASE_PROJECT_REF}" = "mgxsjobicqyddoaejqvf"

      - uses: supabase/setup-cli@v2
        with:
          version: 2.84.2
          github-token: ${{ github.token }}

      - name: Link the approved production target
        shell: bash
        run: supabase link --project-ref "${SUPABASE_PROJECT_REF}" --password "${SUPABASE_DB_PASSWORD}"

      - name: Show local and remote migration history only
        shell: bash
        run: supabase migration list --linked

      - name: Verify reconciled migration history
        shell: bash
        run: |
          set -euo pipefail
          history="$(supabase migration list --linked)"
          for version in \
            20260828050013 20260828050021 20260828050029 \
            20260828050433 20260828052604
          do
            printf '%s\n' "$history" | grep -E "^[[:space:]]*$version[[:space:]]*\\|[[:space:]]*$version[[:space:]]*\\|"
          done

      - name: Preview pending migrations
        shell: bash
        run: supabase db push --linked --dry-run

      - name: Apply pending migrations
        if: ${{ inputs.deploy_m2 }}
        shell: bash
        run: supabase db push --linked

      - name: Show final migration history
        if: ${{ inputs.deploy_m2 }}
        shell: bash
        run: supabase migration list --linked

      - name: Verify production M2 schema contract
        shell: bash
        run: |
          set -euo pipefail
          schema_file="${RUNNER_TEMP}/production-public-schema.sql"
          supabase db dump --linked --schema public --file "$schema_file"

          for table in \
            data_sources pipeline_runs source_items_raw events canonical_places \
            event_provenance place_provenance data_review_queue
          do
            grep -Eq "^CREATE TABLE (IF NOT EXISTS )?public\\.${table}[[:space:](]" "$schema_file"
            grep -Eq "^ALTER TABLE (ONLY )?public\\.${table} ENABLE ROW LEVEL SECURITY;" "$schema_file"
          done

          grep -Eq '^CREATE (OR REPLACE )?FUNCTION public\.add_event_to_itinerary\(' "$schema_file"
          grep -Eq '^CREATE (OR REPLACE )?FUNCTION public\.update_data_draft\(' "$schema_file"
          grep -Eq '^CREATE (OR REPLACE )?FUNCTION public\.review_data_item\(' "$schema_file"

          grep -Eq '^REVOKE ALL ON FUNCTION public\.add_event_to_itinerary\(' "$schema_file"
          grep -Eq '^REVOKE ALL ON FUNCTION public\.update_data_draft\(' "$schema_file"
          grep -Eq '^REVOKE ALL ON FUNCTION public\.review_data_item\(' "$schema_file"
          grep -Eq '^GRANT SELECT ON TABLE public\.data_review_queue TO authenticated;' "$schema_file"
          ! grep -Eq '^GRANT .*UPDATE.* ON TABLE public\.data_review_queue TO authenticated;' "$schema_file"

          echo 'Verified production M2 contract: 8 tables with RLS, 3 protected RPCs, and no authenticated direct review-queue update.'
