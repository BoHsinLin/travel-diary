name: Supabase migration readiness

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-production-migration-readiness
  cancel-in-progress: false

jobs:
  remote-history:
    name: Read-only production migration history
    runs-on: ubuntu-latest
    environment: production-migrations
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: mgxsjobicqyddoaejqvf
    steps:
      - uses: actions/checkout@v5

      - name: Fail closed when migration authority is unavailable
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}"
          test -n "${SUPABASE_DB_PASSWORD:-}"
          test "${SUPABASE_PROJECT_REF}" = "mgxsjobicqyddoaejqvf"

      - uses: supabase/setup-cli@v2
        with:
          version: 2.84.2
          github-token: ${{ github.token }}

      - name: Link the approved production target
        shell: bash
        run: supabase link --project-ref "${SUPABASE_PROJECT_REF}" --password "${SUPABASE_DB_PASSWORD}"

      - name: Show local and remote migration history only
        shell: bash
        run: supabase migration list --linked
