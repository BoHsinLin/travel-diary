name: Prepare GitHub Pages deployment

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build with required production configuration
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_REQUIRE_SUPABASE_CONFIG: 'true'
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          test -n "$VITE_SUPABASE_URL" || (echo 'Missing github-pages variable VITE_SUPABASE_URL' && exit 1)
          test -n "$VITE_SUPABASE_ANON_KEY" || (echo 'Missing github-pages secret VITE_SUPABASE_ANON_KEY' && exit 1)
          pnpm build
          pnpm check:pwa-cache
      - name: Create and verify SPA fallback
        run: |
          cp dist/index.html dist/404.html
          test -f dist/404.html
          grep -q "/${{ github.event.repository.name }}/assets/" dist/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
